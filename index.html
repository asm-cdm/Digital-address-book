<script data-asm-persist-storage-module="true">
// Runs on every app open (module: storage protection)
// Request persistent storage so the browser doesn't
// auto-clear data when device storage runs low
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().then(function(granted) {
    if (granted) {
      console.log("Storage is now persistent — protected from auto-clear.");
    } else {
      console.log("Persistent storage not granted by browser.");
    }
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root{
    --paper:#f8fafc;
    --paper-2:#f1f5f9;
    --ink:#1e293b;
    --ink-soft:#64748b;
    --teal:#2f5db5;
    --teal-dark:#1e3a8a;
    --brass:#B08A3E;
    --brass-soft:#DDBE84;
    --card:#FFFFFF;
    --danger:#A5403A;
    --line:#cbd5e1;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  #fab-app{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    padding:22px 20px 14px;
    background:var(--teal-dark);
    color:var(--paper);
    position:sticky;
    top:0;
    z-index:5;
  }
  .topbar-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .reset-link{
    background:transparent;
    border:1px solid rgba(255,255,255,0.35);
    color:#E7C7C2;
    font-size:11px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    padding:5px 11px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    margin-top:3px;
  }
  .owner-line-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:10.5px;
    color:#9CA79F;
    margin-top:5px;
    letter-spacing:0.02em;
  }
  .topbar h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:22px;
    margin:2px 0 0;
  }
  .topbar .sub{
    font-size:12.5px;
    color:#C9CFC9;
    margin-top:2px;
  }
  .sub-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .backup-link{
    background:transparent;
    border:1px solid var(--brass-soft);
    color:var(--brass-soft);
    font-size:11px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    padding:5px 11px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .entity-tabs{
    display:flex;
    gap:6px;
    padding:12px 16px 0;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:4;
  }
  .entity-tab{
    flex:1;
    text-align:center;
    padding:9px 6px;
    border-radius:10px 10px 0 0;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--paper-2);
    border:1px solid var(--line);
    border-bottom:none;
    cursor:pointer;
  }
  .entity-tab.active{
    background:var(--card);
    color:var(--teal-dark);
  }
  .screen{
    flex:1;
    padding:16px;
    padding-bottom:100px;
    background:var(--card);
    border-top:1px solid var(--line);
  }
  .section-label{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:17px;
    color:var(--teal-dark);
    margin:0 0 12px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin:14px 0 6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  label:first-of-type{margin-top:0;}
  select, input[type=text], input[type=email], input[type=tel], textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    outline:none;
  }
  select:focus, input:focus, textarea:focus{
    border-color:var(--teal);
  }
  textarea{resize:vertical;min-height:110px;font-family:'Inter',sans-serif;}
  .addr-field{
    width:25ch;
    max-width:100%;
    min-height:0;
    height:calc(7 * 1.35em + 22px);
  }
  .addr-box{
    width:25ch;
    max-width:100%;
    height:calc(7 * 1.35em + 12px);
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 8px;
    background:var(--paper);
    white-space:pre-line;
  }
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 18px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--teal-dark);color:var(--brass-soft);width:100%;margin-top:20px;}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  .btn-outline{background:transparent;color:var(--teal-dark);border:1.5px solid var(--teal);}
  .btn-small{padding:8px 12px;font-size:13px;}
  .inline-add{display:flex;gap:8px;margin-top:6px;}
  .inline-add input{flex:1;}
  .card-item{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:4px solid var(--brass);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .card-item .name{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:16px;
    color:var(--teal-dark);
  }
  .card-item .tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:600;
    color:var(--teal-dark);
    background:var(--brass-soft);
    padding:2px 8px;
    border-radius:20px;
    margin:4px 6px 4px 0;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .card-item .addr{
    font-size:13px;
    color:var(--ink-soft);
    margin:6px 0;
    white-space:pre-line;
  }
  .card-item .contact-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink);
    margin:2px 0;
  }
  .card-item .note-line{
    font-size:12.5px;
    font-style:italic;
    color:var(--teal);
    margin:4px 0;
  }
  .card-actions{display:flex;gap:8px;margin-top:10px;}
  .empty{
    text-align:center;
    padding:40px 10px;
    color:var(--ink-soft);
  }
  .empty .big{font-family:'Fraunces',serif;font-size:17px;color:var(--teal-dark);margin-bottom:6px;}
  .bottomnav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    display:flex;
    background:#fff;
    border-top:1px solid var(--line);
    box-shadow:0 -2px 5px rgba(0,0,0,.05);
    z-index:10;
  }
  .navbtn{
    flex:1;
    text-align:center;
    padding:12px 4px 10px;
    color:#64748b;
    cursor:pointer;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.02em;
    border-top:3px solid transparent;
  }
  .navbtn .icon{font-size:19px;display:block;margin-bottom:2px;}
  .navbtn.active{color:var(--teal-dark);border-top-color:var(--teal-dark);}
  .toast{
    position:fixed;
    bottom:78px;
    left:50%;
    transform:translateX(-50%);
    background:var(--teal-dark);
    color:var(--paper);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
    z-index:20;
    max-width:80%;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
  }
  .toast.show{opacity:1;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,20,18,0.45);
    display:flex;align-items:center;justify-content:center;z-index:30;
    padding:20px;
  }
  .modal{max-height:90vh;overflow-y:auto;
    background:var(--card);
    border-radius:14px;
    padding:20px;
    width:100%;
    max-width:340px;
  }
  .modal p{font-size:14px;color:var(--ink);margin:0 0 18px;}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;}
  .filterbar{display:flex;gap:8px;margin-bottom:14px;}
  .filterbar select{font-size:13px;padding:9px 10px;}
  .count-pill{
    font-size:11px;color:var(--ink-soft);margin-left:8px;
  }
  .selectall-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .selectall-row label{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
    text-transform:none;
    letter-spacing:normal;
    color:var(--teal-dark);
    margin:0;
  }
  .selectall-row input[type=checkbox]{width:16px;height:16px;}
  .field-check-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px 16px;
    margin-top:8px;
  }
  .field-check{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:400;
    text-transform:none;
    letter-spacing:normal;
    color:var(--ink);
    margin:0;
  }
  .field-check input{width:15px;height:15px;}
  .section-heading{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:14px;
    color:var(--teal-dark);
    background:var(--brass-soft);
    padding:6px 10px;
    border-radius:8px;
    margin:16px 0 8px;
  }
  .section-heading:first-child{ margin-top:0; }
  .card-item label{
    display:flex;
    align-items:flex-start;
    gap:9px;
    font-size:13px;
    font-weight:400;
    text-transform:none;
    letter-spacing:normal;
    color:var(--ink);
    margin:0;
    cursor:pointer;
  }
  .card-item input[type=checkbox]{
    width:16px;height:16px;margin-top:3px;flex-shrink:0;
  }
  .card-item .card-body{flex:1;min-width:0;}

  .drive-box{margin-top:14px;padding-top:12px;border-top:1px solid #d9d4c7;}
  .drive-box .last{font-size:12.5px;color:var(--teal);margin:0 0 10px;}
  .drive-list button{width:100%;margin-top:8px;}
  .drive-warn{position:fixed;left:50%;top:18px;transform:translateX(-50%);max-width:90%;background:#8a5a00;color:#fff;
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;text-align:center;}
  .drive-warn.show{opacity:1;}

  .view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .view-head .section-label{margin:0;}
  .pdf-btn{background:var(--teal-dark);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(26,61,143,.25);flex:none;}
  .pdf-btn:active{transform:scale(.97);}
  .help-link{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff;border-radius:18px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;flex:none;white-space:nowrap;}
  .bk-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
  .bk-card h3{margin:0 0 4px;font-size:15px;color:var(--teal-dark);}
  .bk-card .last{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .bk-card .btn{width:100%;margin-top:8px;}
  .modal-center p{text-align:center;}
  .help-topic{display:block;width:100%;text-align:left;margin-top:8px;}
  .help-text{font-size:13.5px;line-height:1.55;color:var(--ink);text-align:left;white-space:pre-line;}
  @media (min-width:900px){
    .phone{max-width:900px;box-shadow:0 0 30px rgba(26,61,143,.12);}
    .bottomnav{max-width:900px;}
    #screen{padding-left:40px;padding-right:40px;}
  }
</style>

<body>

<div id="fab-app">
  <div class="phone">
    <div class="topbar">
      <div class="topbar-row">
        <h1>Digital Address Book</h1>
        <button id="helpBtn" class="help-link" type="button" title="Help">? Help</button>
      </div>
      <div class="sub-row">
        <div class="sub" id="topSub">Add a new Group, Subgroup, Address Entry</div>
      </div>
      <div class="owner-line-row">
        <span>Powered by A.S.M Consultancy Services</span>
        <span>Ver 1.5</span>
      </div>
      <div class="owner-line-row">
        <span>Chidambaram</span>
      </div>
    </div>

    <div class="entity-tabs" id="entityTabs"></div>
    <div class="screen" id="screen"></div>

    <div class="bottomnav" id="bottomNav">
      <div class="navbtn" data-tab="create"><span class="icon">＋</span>Create</div>
      <div class="navbtn" data-tab="modify"><span class="icon">✎</span>Modify</div>
      <div class="navbtn" data-tab="view"><span class="icon">▤</span>View / PDF</div>
      <div class="navbtn" data-tab="backup"><span class="icon">⇅</span>Backup</div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
</div>

<script>
(function(){
  const STORE_KEY = 'kudumbam-db-v1';
  let db = { groups: [], subgroups: [], entries: [] };
  let state = { tab: 'create', entity: 'address', editingId: null, filterGroup:'', filterSubgroup:'', selectedIds: new Set() };

  const $ = sel => document.querySelector(sel);
  const screen = $('#screen');
  const entityTabsEl = $('#entityTabs');
  const topSub = $('#topSub');

  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function parseDMY(str){
    if(!str || !str.trim()) return null;
    const m = str.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(!m) return null;
    const d = parseInt(m[1],10), mo = parseInt(m[2],10), y = parseInt(m[3],10);
    if(mo<1||mo>12) return null;
    const dt = new Date(y, mo-1, d);
    if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return null;
    return { day:d, month:mo, year:y };
  }

  function showToast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function showPopup(msg, ms){
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-backdrop"><div class="modal modal-center"><p>${msg}</p>${ms?'':'<div class="actions" style="justify-content:center;"><button class="btn btn-outline btn-small" id="popOk">OK</button></div>'}</div></div>`;
    if(ms) setTimeout(()=>{ root.innerHTML=''; }, ms);
    else root.querySelector('#popOk').onclick = ()=>{ root.innerHTML=''; };
  }

  function viewHead(title){
    return `<div class="view-head"><div class="section-label">${title}</div><button class="pdf-btn" id="pdfTop" type="button">⬇ PDF</button></div>`;
  }
  function savePdf(doc, filename){
    doc.save(filename || 'Digital-Address-Book.pdf');
    showPopup('PDF saved', 1800);
  }
  function pdfChoice(options){
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-backdrop"><div class="modal"><p style="font-weight:700;color:var(--teal-dark);margin-bottom:4px;">Save PDF</p>${options.map((o,i)=>`<button class="btn btn-outline help-topic" data-i="${i}">${o.label}</button>`).join('')}<div class="actions" style="margin-top:14px;"><button class="btn btn-outline btn-small" id="pcClose">Cancel</button></div></div></div>`;
    root.querySelectorAll('[data-i]').forEach(b=> b.onclick = ()=>{ root.innerHTML=''; options[b.dataset.i].run(); });
    root.querySelector('#pcClose').onclick = ()=>{ root.innerHTML=''; };
  }

  function confirmModal(msg, onYes, yesLabel){
    yesLabel = yesLabel || 'Delete';
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal">
          <p>${msg}</p>
          <div class="actions">
            <button class="btn btn-outline btn-small" id="mCancel">Cancel</button>
            <button class="btn btn-danger btn-small" id="mYes">${yesLabel}</button>
          </div>
        </div>
      </div>`;
    root.querySelector('#mCancel').onclick = ()=> root.innerHTML='';
    root.querySelector('#mYes').onclick = ()=>{ root.innerHTML=''; onYes(); };
  }

  async function storageGet(key){
    if(window.storage){
      try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
      catch(e){ return null; }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  async function storageSet(key, val){
    if(window.storage){
      try{ await window.storage.set(key, val, false); return; }catch(e){ /* fall through */ }
    }
    try{ localStorage.setItem(key, val); }catch(e){ /* storage unavailable */ }
  }

  async function load(){
    const val = await storageGet(STORE_KEY);
    if(val){ try{ db = JSON.parse(val); }catch(e){ /* corrupt, keep defaults */ } }
    render();
    driveShowWarning();
  }
  async function save(){
    await storageSet(STORE_KEY, JSON.stringify(db));
  }

  /* ===== MODULE: Google Drive backup (sign-in) ===== */
  const DRIVE_CLIENT_ID = '978793704970-e1isrkd8too2qlistrtpqdgn8oj2h98j.apps.googleusercontent.com';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const DRIVE_FOLDER = 'ASM Backups';
  const DRIVE_APP_NAME = 'digital-address-book';
  const DRIVE_LAST_KEY = 'asm_ab_last_drive_backup';
  const DRIVE_WARN_DAYS = 4;      // warn if last backup older than this
  const DRIVE_WARN_MS = 4000;     // warning disappears after 4 sec
  let driveToken = null, driveTokenExp = 0;

  function driveFileName(year){ return DRIVE_APP_NAME + '-' + (year || new Date().getFullYear()) + '.json'; }
  function driveLastGet(){ try{ return localStorage.getItem(DRIVE_LAST_KEY); }catch(e){ return null; } }
  function driveLastSet(){ try{ localStorage.setItem(DRIVE_LAST_KEY, new Date().toISOString()); }catch(e){} }
  function driveLastText(){
    const v = driveLastGet();
    if(!v) return 'Last Drive backup: never';
    const d = new Date(v);
    return 'Last Drive backup: ' + d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function driveGetToken(){
    return new Promise((resolve, reject)=>{
      if(driveToken && Date.now() < driveTokenExp) return resolve(driveToken);
      if(!(window.google && google.accounts && google.accounts.oauth2)){
        return reject(new Error('Google sign-in not available. Check internet / open in Chrome.'));
      }
      const client = google.accounts.oauth2.initTokenClient({
        client_id: DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: (resp)=>{
          if(resp.error) return reject(new Error('Sign-in failed'));
          driveToken = resp.access_token;
          driveTokenExp = Date.now() + (Number(resp.expires_in||3600) - 60) * 1000;
          resolve(driveToken);
        },
        error_callback: ()=> reject(new Error('Sign-in cancelled'))
      });
      client.requestAccessToken({prompt: driveToken ? '' : 'select_account'});
    });
  }

  async function driveApi(url, opts){
    const token = await driveGetToken();
    opts = opts || {};
    opts.headers = Object.assign({Authorization: 'Bearer ' + token}, opts.headers || {});
    const r = await fetch(url, opts);
    if(!r.ok) throw new Error('Drive error ' + r.status);
    return r;
  }

  async function driveFindFolder(create){
    const q = encodeURIComponent("name='" + DRIVE_FOLDER + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const r = await driveApi('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)');
    const j = await r.json();
    if(j.files && j.files.length) return j.files[0].id;
    if(!create) return null;
    const c = await driveApi('https://www.googleapis.com/drive/v3/files', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name: DRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder'})
    });
    return (await c.json()).id;
  }

  async function driveFindFile(folderId, name){
    const q = encodeURIComponent("name='" + name + "' and '" + folderId + "' in parents and trashed=false");
    const r = await driveApi('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)');
    const j = await r.json();
    return (j.files && j.files.length) ? j.files[0].id : null;
  }

  async function driveBackupNow(){
    const folderId = await driveFindFolder(true);
    const name = driveFileName();
    const fileId = await driveFindFile(folderId, name);
    const body = JSON.stringify(db);
    if(fileId){
      await driveApi('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
        method:'PATCH', headers:{'Content-Type':'application/json'}, body
      });
    } else {
      const boundary = 'asmab' + Date.now();
      const meta = JSON.stringify({name, parents:[folderId], mimeType:'application/json'});
      const multi = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta +
        '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + boundary + '--';
      await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + boundary}, body: multi
      });
    }
    driveLastSet();
  }

  async function driveListBackups(){
    const folderId = await driveFindFolder(false);
    if(!folderId) return [];
    const q = encodeURIComponent("name contains '" + DRIVE_APP_NAME + "-' and '" + folderId + "' in parents and trashed=false");
    const r = await driveApi('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)&orderBy=name desc');
    return (await r.json()).files || [];
  }

  async function driveDownload(fileId){
    const r = await driveApi('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
    return await r.json();
  }

  function driveApplyRestore(parsed){
    db = {
      groups: parsed.groups || [], subgroups: parsed.subgroups || [], entries: parsed.entries || [],
      lastGroupId: parsed.lastGroupId || null, lastSubgroupId: parsed.lastSubgroupId || null
    };
    save();
    showPopup('Restored from Google Drive');
    render();

  async function driveRestoreClick(){
    const box = document.getElementById('driveList');
    try{
      const files = await driveListBackups();
      if(!files.length){ showPopup('No backup found in Drive'); return; }
      box.innerHTML = files.map(f=>`<button class="btn btn-outline btn-small" data-fid="${f.id}">${f.name}</button>`).join('');
      box.querySelectorAll('[data-fid]').forEach(b=>{
        b.onclick = async ()=>{
          try{
            const parsed = await driveDownload(b.dataset.fid);
            if(!parsed || !Array.isArray(parsed.groups) || !Array.isArray(parsed.entries)){ showToast('Not a valid backup file'); return; }
            confirmModal('Replace all data on this device with this Drive backup? This cannot be undone.', ()=>driveApplyRestore(parsed), 'Replace');

        };
      });
    }catch(e){ showPopup(e.message || 'Drive restore failed'); }
  }

  function exportData(){
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `digital-address-book-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showPopup('Backup file saved');
  }

  function importData(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ showToast('That file could not be read'); return; }
      if(!parsed || !Array.isArray(parsed.groups) || !Array.isArray(parsed.entries)){
        showToast('Not a valid backup file'); return;
      }
      confirmModal(
        'Replace all data on this device with the imported backup? This cannot be undone.',
        ()=>{
          db = {
            groups: parsed.groups || [],
            subgroups: parsed.subgroups || [],
            entries: parsed.entries || [],
            lastGroupId: parsed.lastGroupId || null,
            lastSubgroupId: parsed.lastSubgroupId || null
          };
          save();
          showPopup('Backup restored');
          render();
        },
        'Replace'
      );
    };
    reader.readAsText(file);
  }

  function subgroupsFor(groupId){ return db.subgroups.filter(s=>s.groupId===groupId); }
  function entriesFor(groupId, subgroupId){
    return db.entries.filter(e =>
      (!groupId || e.groupId===groupId) &&
      (!subgroupId || e.subgroupId===subgroupId)
    );
  }

  function renderModifyAddress(){
    if(state.editingId){
      if($('#fGroup')){
        state.modifyFilterGroup = $('#fGroup').value;
        state.modifyFilterSub = $('#fSub').value;
      }
      const e = db.entries.find(x=>x.id===state.editingId);
      if(!e){ state.editingId=null; return renderModifyAddress(); }
      screen.innerHTML = `<div class="section-label">Edit Entry</div>` + addressFormHtml(e);
      $('#eGroup').value = e.groupId;
      function refreshSub(preserve){
        const gid = $('#eGroup').value;
        $('#eSub').innerHTML = selectOptions(subgroupsFor(gid),'id',s=>s.name,'Select a subgroup');
        if(preserve) $('#eSub').value = e.subgroupId;
        refreshRelated();
      }
      function refreshRelated(){
        const sid = $('#eSub').value;
        const inScope = sid ? db.entries.filter(en=>en.subgroupId===sid && en.id!==e.id) : [];
        $('#eRelated').innerHTML = '<option value="">— None —</option>' + inScope.map(en=>`<option value="${en.id}">${en.name}</option>`).join('');
        $('#eRelated').value = e.relatedTo || '';
      }
      refreshSub(true);
      $('#eGroup').onchange = ()=>refreshSub(false);
      $('#eSub').addEventListener('change', refreshRelated);
      $('#updAddr').onclick = ()=>{
        const bdayRaw = $('#eBday').value.trim(), annivRaw = $('#eAnniv').value.trim();
        if(bdayRaw && !parseDMY(bdayRaw)){ showToast('Birthday must be DD/MM/YYYY, e.g. 05/08/1990'); return; }
        if(annivRaw && !parseDMY(annivRaw)){ showToast('Anniversary must be DD/MM/YYYY, e.g. 21/12/2015'); return; }
        const relatedVal = $('#eRelated').value;
        if(relatedVal===e.id){ showToast('An entry cannot be related to itself'); return; }
        const addressText = $('#eAddr').value.trim();
        e.groupId = $('#eGroup').value;
        e.subgroupId = $('#eSub').value;
        e.name = $('#eName').value.trim() || e.name;
        e.note = $('#eNote').value.trim();
        e.company = $('#eCompany').value.trim();
        e.relatedTo = relatedVal || '';
        e.address = addressText;
        e.contact1 = $('#eC1').value.trim();
        e.contact2 = $('#eC2').value.trim();
        e.whatsapp = $('#eWa').value.trim();
        e.email = $('#eEmail').value.trim();
        e.birthday = bdayRaw;
        e.anniversary = annivRaw;
        save(); state.editingId=null; showToast('Entry updated'); render();
      };
      $('#delAddr').onclick = ()=>{
        const childCount = db.entries.filter(x=>x.relatedTo===e.id).length;
        if(childCount>0){
          showToast(`Can't delete — ${childCount} entr${childCount===1?'y is':'ies are'} linked as "Related to" this one. Unlink or delete those first.`);
          return;
        }
        confirmModal(`Delete entry for "${e.name}"?`, ()=>{
          db.entries = db.entries.filter(x=>x.id!==e.id);
          save(); state.editingId=null; showToast('Entry deleted'); render();
        });
      };
      $('#cancelA').onclick = ()=>{ state.editingId=null; render(); };
      return;
    }
    screen.innerHTML = `
      <div class="section-label">Modify Address Entries</div>
      <div class="filterbar">
        <select id="fGroup">${selectOptions(db.groups,'id',g=>g.name,'All groups')}</select>
        <select id="fSub"><option value="">All subgroups</option></select>
      </div>
      <div id="maList"></div>
    `;
    function refreshSubFilter(preserveSub){
      const gid = $('#fGroup').value;
      const list = gid ? subgroupsFor(gid) : db.subgroups;
      $('#fSub').innerHTML = selectOptions(list,'id',s=>s.name,'All subgroups');
      if(preserveSub) $('#fSub').value = preserveSub;
    }
    function refresh(){
      const gid = $('#fGroup').value, sid = $('#fSub').value;
      const list = entriesFor(gid, sid);
      const ordered = buildRelationOrder(list);
      $('#maList').innerHTML = ordered.map(({entry:e, depth})=>`
        <div class="card-item" style="${depth>0 ? `margin-left:${depth*20}px;border-left-color:var(--teal);` : ''}">
          ${depth>0 ? `<span class="count-pill">↳ related to ${(db.entries.find(x=>x.id===e.relatedTo)||{}).name||''}</span><br>` : ''}
          <span class="name">${e.name}</span>
          ${e.company ? `<span class="tag">${e.company}</span>` : ''}
          <span class="tag">${groupName(e.groupId)}</span>
          <span class="tag">${subgroupName(e.subgroupId)}</span>
          ${e.note ? `<div class="note-line">${e.note}</div>` : ''}
          <div class="contact-line">${e.contact1||''}</div>
          <div class="card-actions"><button class="btn btn-outline btn-small" data-edit="${e.id}">Edit</button></div>
        </div>`).join('') || `<div class="empty"><div class="big">No entries found</div>Try a different filter or create one.</div>`;
      screen.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=>{ state.editingId=b.dataset.edit; renderModifyAddress(); });
    }
    if(state.modifyFilterGroup) $('#fGroup').value = state.modifyFilterGroup;
    refreshSubFilter(state.modifyFilterSub);
    $('#fGroup').onchange = ()=>{ refreshSubFilter(); refresh(); };
    $('#fSub').onchange = refresh;
    refresh();
  }

    function cardHtml(e, depth){

      return `
        <div class="card-item" style="${depth>0 ? `margin-left:${depth*20}px;border-left-color:var(--teal);` : ''}">
          ${parent ? `<span class="count-pill">↳ related to ${parent.name}</span><br>` : ''}

            <span class="card-body">
              <span class="name">${e.name}</span>
              ${e.company ? `<span class="tag">${e.company}</span>` : ''}
              <span class="tag">${groupName(e.groupId)}</span>
              <span class="tag">${subgroupName(e.subgroupId)}</span>
              ${e.note ? `<div class="note-line">${e.note}</div>` : ''}
              <div class="addr addr-box">${(e.address||'').replace(/</g,'&lt;')}</div>
              <div class="contact-line">📞 ${e.contact1||'—'} ${e.contact2? ' / '+e.contact2:''}</div>

    function refresh(){
      const gid = $('#pfGroup').value, sid = $('#pfSub').value;
      const list = currentFiltered();
      if(sid){
        const ordered = buildRelationOrder(list);
        $('#pvList').innerHTML = ordered.map(({entry,depth})=>cardHtml(entry,depth)).join('') || `<div class="empty"><div class="big">No entries found</div>Try a different filter.</div>`;
      } else {
        const sections = buildGroupSubgroupSections(list);
        $('#pvList').innerHTML = sections.map(sec => `
          <div class="section-heading">${groupName(sec.groupId)} , ${subgroupName(sec.subgroupId)}</div>
          ${buildRelationOrder(sec.entries).map(({entry,depth})=>cardHtml(entry,depth)).join('')}
        `).join('') || `<div class="empty"><div class="big">No entries found</div>Try a different filter.</div>`;
      }
      screen.querySelectorAll('.entryChk').forEach(chk=>{
        chk.onchange = ()=>{
          if(chk.checked) state.selectedIds.add(chk.dataset.id);
          else state.selectedIds.delete(chk.dataset.id);
          updateSelectAllState(list);
          updateCount();
        };
      });
      updateSelectAllState(list);
      updateCount();

    function reveal(){
      if(revealed) return;
      revealed = true;
      $('#selectAllRow').style.display = 'flex';
      $('#pdfAddr').style.display = 'inline-flex';

    function refreshSubFilter(){

      const list = gid ? subgroupsFor(gid) : db.subgroups;
      $('#pfSub').innerHTML = selectOptions(list,'id',s=>s.name,'All subgroups');
    }
    refreshSubFilter();
    $('#pfGroup').onchange = ()=>{ refreshSubFilter(); reveal(); refresh(); };
    $('#pfSub').onchange = ()=>{ reveal(); refresh(); };
    $('#selectAllChk').onchange = ()=>{

      if($('#selectAllChk').checked){ list.forEach(e=>state.selectedIds.add(e.id)); }

      refresh();

    $('#pdfAddr').onclick = ()=>{

      if(state.selectedIds.size>0){
        list = db.entries.filter(e=>state.selectedIds.has(e.id));

        filename = `Selected-Entries-${todayStr()}.pdf`;
      } else {
        const gid = $('#pfGroup').value, sid = $('#pfSub').value;

        note = [gid?groupName(gid):null, sid?subgroupName(sid):null].filter(Boolean).join(' / ') || null;
        filename = gid ? `${slug(groupName(gid))}${sid?'-'+slug(subgroupName(sid)):'-All-Subgroups'}.pdf` : 'Digital-Address-Book-Filtered.pdf';
      }
      exportAddressPdf(list, note, false, filename);
    };

    $('#pdfAll').onclick = ()=>{
      const sorted = [...db.entries].sort((a,b)=>
        groupName(a.groupId).localeCompare(groupName(b.groupId)) ||
        subgroupName(a.subgroupId).localeCompare(subgroupName(b.subgroupId)) ||
        (a.name||'').localeCompare(b.name||'')
      );
      exportAddressPdf(sorted, 'All Entries', false, 'Digital-Address-Book-All.pdf');
    };
    $('#pdfAllGS').onclick = ()=>{
      const gid = $('#pfGroup').value, sid = $('#pfSub').value;
      const flat = entriesFor(gid, sid);
      const pairs = buildGroupSubgroupSections(flat);
      let filename;
      if(gid && sid) filename = `${slug(groupName(gid))}-${slug(subgroupName(sid))}.pdf`;
      else if(gid) filename = `${slug(groupName(gid))}-All-Subgroups.pdf`;
      else filename = 'Digital-Address-Book-Grouped-All.pdf';
      exportAddressPdfGrouped(pairs, filename);
    };
  }

  // ---------------- VIEW / PDF: BIRTHDAYS & ANNIVERSARIES ----------------
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function renderViewBirthdays(){
    screen.innerHTML = `
      ${viewHead('Birthdays &amp; Anniversaries')}
      <label>Show</label>
      <select id="bdType">
        <option value="both">Birthday &amp; Anniversary</option>
        <option value="birthday">Birthday only</option>
        <option value="anniversary">Anniversary only</option>
      </select>
      <label>Month</label>
      <select id="bdMonth">
        <option value="">Select a month</option>
        ${MONTH_NAMES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}
      </select>
      <label>Year (optional — leave blank to match every year)</label>
      <input type="text" id="bdYear" placeholder="e.g. 1990">
      <div class="filterbar">
        <select id="bdGroup">${selectOptions(db.groups,'id',g=>g.name,'All groups')}</select>
        <select id="bdSub"><option value="">All subgroups</option></select>
      </div>
      <div id="bdList"><div class="empty"><div class="big">Choose a Month</div>Select a month above to see matching birthdays and anniversaries.</div></div>
      <div style="display:none"><button id="bdExport"></button></div>
    `;

    $('#pdfTop').onclick = ()=>{ if($('#bdExport').style.display==='none'){ showPopup('Choose a month first, then save the PDF'); } else $('#bdExport').click(); };

    function updateBdSubOptions(){
      const gid = $('#bdGroup').value;
      const list = gid ? subgroupsFor(gid) : db.subgroups;
      $('#bdSub').innerHTML = selectOptions(list, 'id', s=>s.name, 'All subgroups');
    }

    updateBdSubOptions();

    $('#bdGroup').addEventListener('change', ()=>{
      updateBdSubOptions();
      refresh();
    });

    function computeMatches(){
      const type = $('#bdType').value;
      const month = parseInt($('#bdMonth').value, 10);
      const yearStr = $('#bdYear').value.trim();
      const year = yearStr ? parseInt(yearStr,10) : null;
      const gid = $('#bdGroup').value, sid = $('#bdSub').value;
      if(!month) return null;

      const rows = [];
      entriesFor(gid, sid).forEach(e=>{
        [['birthday','Birthday'], ['anniversary','Anniversary']].forEach(([field, label])=>{
          if(type!=='both' && type!==field) return;
          const parsed = parseDMY(e[field]);
          if(!parsed) return;
          if(parsed.month !== month) return;
          if(year && parsed.year !== year) return;
          rows.push({ name: e.name, type: label, day: parsed.day, month: parsed.month, year: parsed.year,
                      groupId: e.groupId, subgroupId: e.subgroupId,
                      dateStr: `${String(parsed.day).padStart(2,'0')}/${String(parsed.month).padStart(2,'0')}/${parsed.year}` });
        });
      });
      rows.sort((a,b)=> a.day - b.day || a.name.localeCompare(b.name));
      return rows;
    }

    function refresh(){
      const rows = computeMatches();
      if(rows === null){
        $('#bdList').innerHTML = `<div class="empty"><div class="big">Choose a Month</div>Select a month above to see matching birthdays and anniversaries.</div>`;
        $('#bdExport').style.display = 'none';
        return;
      }
      $('#bdExport').style.display = 'inline-flex';
      $('#bdList').innerHTML = rows.map(r=>`
        <div class="card-item">
          <span class="name">${r.name}</span>
          <span class="tag">${r.type}</span>
          <span class="tag">${groupName(r.groupId)}</span>
          <span class="tag">${subgroupName(r.subgroupId)}</span>
          <div class="contact-line">📅 ${r.dateStr}</div>
        </div>`).join('') || `<div class="empty"><div class="big">No matches</div>No birthdays or anniversaries found for this Month/Year/Group/Subgroup.</div>`;
    }

    ['bdType','bdMonth','bdYear','bdSub'].forEach(id=>{
      $('#'+id).addEventListener('input', refresh);
      $('#'+id).addEventListener('change', refresh);
    });
    refresh();

    $('#bdExport').onclick = ()=>{
      const rows = computeMatches();
      if(!rows){ showToast('Select a month first'); return; }
      const month = $('#bdMonth').value;
      const monthName = MONTH_NAMES[parseInt(month,10)-1];
      const yearStr = $('#bdYear').value.trim();
      const gid = $('#bdGroup').value, sid = $('#bdSub').value;
      let titleParts = [monthName];
      if(yearStr) titleParts.push(yearStr);
      if(gid) titleParts.push(groupName(gid));
      if(sid) titleParts.push(subgroupName(sid));
      const filenameParts = ['Birthdays-Anniversaries', ...titleParts.map(slug)];
      exportBirthdaysPdf(rows, titleParts.join(' — '), filenameParts.join('-') + '.pdf');
    };
  }

    $('#fieldChecks').querySelectorAll('[data-field]').forEach(chk=>{
      chk.onchange = ()=>{ state.searchFields[chk.dataset.field] = chk.checked; };
    });

    function currentMatches(){
      const q = $('#searchQ').value.trim().toLowerCase();
      if(!q) return [];
      return db.entries.filter(e=>
        (e.name||'').toLowerCase().includes(q) || (e.company||'').toLowerCase().includes(q)
      );
    }
    function updateSelectAllState(list){
      $('#searchSelectAll').checked = list.length>0 && list.every(e=>state.selectedIds.has(e.id));
    }
    function updateCount(){
      $('#searchCount').textContent = state.selectedIds.size ? `${state.selectedIds.size} selected` : '';
    }
    function refresh(){
      const q = $('#searchQ').value.trim();
      if(!q){
        $('#searchList').innerHTML = `<div class="empty"><div class="big">Start typing</div>Search by Name or Company Name to find entries.</div>`;
        updateCount();
        return;
      }
      const list = currentMatches();
      $('#searchList').innerHTML = list.map(e=>`
        <div class="card-item">
          <label>
            <input type="checkbox" class="entryChk" data-id="${e.id}" ${state.selectedIds.has(e.id)?'checked':''}>
            <span class="card-body">
              <span class="name">${e.name}</span>
              ${e.company ? `<span class="tag">${e.company}</span>` : ''}
              <span class="tag">${groupName(e.groupId)}</span>

        </div>`).join('') || `<div class="empty"><div class="big">No matches</div>Try a different name or company.</div>`;

          updateSelectAllState(list);
          updateCount();
        };
      });
      updateSelectAllState(list);
      updateCount();
    }

    $('#searchQ').addEventListener('input', refresh);
    $('#searchSelectAll').onchange = ()=>{
      const list = currentMatches();
      if($('#searchSelectAll').checked){ list.forEach(e=>state.selectedIds.add(e.id)); }
      else{ list.forEach(e=>state.selectedIds.delete(e.id)); }
      refresh();
    };
    refresh();

    function buildText(){
      const selected = db.entries.filter(e=>state.selectedIds.has(e.id));
      if(!selected.length) return '';
      return selected.map(e=>{
        const lines = [e.name];
        if(state.searchFields.company && e.company) lines.push(e.company);
        if(state.searchFields.note && e.note) lines.push(e.note);
        if(state.searchFields.group) lines.push('Group: ' + groupName(e.groupId));
        if(state.searchFields.subgroup) lines.push('Subgroup: ' + subgroupName(e.subgroupId));
        if(state.searchFields.address && e.address) lines.push(e.address);
        if(state.searchFields.contact1 && e.contact1) lines.push('Contact 1: ' + e.contact1);
        if(state.searchFields.contact2 && e.contact2) lines.push('Contact 2: ' + e.contact2);
        if(state.searchFields.whatsapp && e.whatsapp) lines.push('WhatsApp: ' + e.whatsapp);
        if(state.searchFields.email && e.email) lines.push('Email: ' + e.email);
        if(state.searchFields.birthday && e.birthday) lines.push('Birthday: ' + e.birthday);
        if(state.searchFields.anniversary && e.anniversary) lines.push('Anniversary: ' + e.anniversary);
        return lines.join('\n');
      }).join('\n\n');
    }

    $('#copyWa').onclick = async ()=>{
      const text = buildText();
      if(!text){ showToast('Select at least one entry first'); return; }
      try{
        await navigator.clipboard.writeText(text);
        showToast('Copied — paste it into WhatsApp');
      }catch(err){
        showToast('Could not copy automatically on this device — select and copy manually');
      }
    };
    $('#shareWa').onclick = ()=>{
      const text = buildText();
      if(!text){ showToast('Select at least one entry first'); return; }
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    };
  }

  function buildRelationOrder(list){
    const byId = new Map(list.map(e=>[e.id, e]));
    const childrenMap = new Map();
    const roots = [];
    list.forEach(e=>{
      if(e.relatedTo && byId.has(e.relatedTo) && e.relatedTo!==e.id){
        if(!childrenMap.has(e.relatedTo)) childrenMap.set(e.relatedTo, []);
        childrenMap.get(e.relatedTo).push(e);
      } else {
        roots.push(e);
      }
    });
    const ordered = [];
    function walk(e, depth){
      ordered.push({ entry: e, depth });
      (childrenMap.get(e.id)||[]).forEach(c=>walk(c, depth+1));
    }
    roots.forEach(r=>walk(r, 0));
    return ordered;
  }

  function buildGroupSubgroupSections(flat){
    const map = new Map();
    flat.forEach(e=>{
      const key = e.groupId + '|' + e.subgroupId;
      if(!map.has(key)) map.set(key, { groupId: e.groupId, subgroupId: e.subgroupId, entries: [] });
      map.get(key).entries.push(e);
    });
    return [...map.values()].sort((a,b)=>
      groupName(a.groupId).localeCompare(groupName(b.groupId)) ||
      subgroupName(a.subgroupId).localeCompare(subgroupName(b.subgroupId))
    );
  }

  // ---------------- PDF EXPORT ----------------
  function slug(text){
    return (text||'').toString().trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'File';
  }
  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }
  function newDoc(title){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});

    doc.text(title, 40, 50);
    doc.setDrawColor(180); doc.line(40,58,555,58);

  }
  function footer(doc, y){
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text('Generated by Digital Address Book App', 40, 812);
  }

  function exportGroupsPdf(){
    const doc = newDoc('Digital Address Book — Groups');

      doc.text(groupName(s.groupId), 300, y);

  function exportBirthdaysPdf(rows, titleSuffix, filename){
    filename = filename || 'birthdays-anniversaries.pdf';
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const marginX = 40;
    let y = 46;

    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(20);
    doc.text('Birthdays & Anniversaries' + (titleSuffix ? ' — ' + titleSuffix : ''), marginX, y);
    y += 10;
    doc.setDrawColor(180); doc.line(marginX, y, 555, y);
    y += 24;

    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(90);
    doc.text('Name', marginX, y);
    doc.text('Type', 300, y);
    doc.text('Date', 400, y);
    y += 8;
    doc.setDrawColor(220); doc.line(marginX, y, 555, y);
    y += 16;

    if(!rows.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(20);
      doc.text('No matching birthdays or anniversaries.', marginX, y);
      savePdf(doc, filename);
      return;
    }

    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(20);
    rows.forEach(r=>{
      if(y > 800){
        doc.addPage();
        y = 50;
        doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(90);
        doc.text('Name', marginX, y); doc.text('Type', 300, y); doc.text('Date', 400, y);
        y += 8; doc.setDrawColor(220); doc.line(marginX, y, 555, y); y += 16;
        doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(20);
      }
      doc.text(r.name || '', marginX, y, { maxWidth: 250 });
      doc.text(r.type, 300, y);
      doc.text(r.dateStr, 400, y);
      y += 20;

    savePdf(doc, filename);

  function exportAddressPdfGrouped(pairs, filename){
    filename = filename || 'digital-address-book-grouped.pdf';
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});

    if(!pairs.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(20);
      doc.text('No entries found.', 40, 40);
      savePdf(doc, filename);
      return;
    }

    const pageWidth = 595.28;
    const marginX = 40, bottomY = 825;
    const columns = 2, rowsPerPage = 4;
    const gutterX = 14, gutterY = 14;
    const colWidth = (pageWidth - marginX*2 - gutterX*(columns-1)) / columns;
    const perPage = columns * rowsPerPage;

    function drawHeading(pair){
      doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(20);
      doc.text(`${groupName(pair.groupId)} , ${subgroupName(pair.subgroupId)}`, marginX, 38);
      doc.setDrawColor(180);
      doc.line(marginX, 46, pageWidth - marginX, 46);
    }

    const gridTopY = 64;
    const rowHeight = (bottomY - gridTopY - gutterY*(rowsPerPage-1)) / rowsPerPage;

    pairs.forEach((pair, pIdx)=>{
      if(pIdx>0) doc.addPage();
      drawHeading(pair);

      pair.entries.forEach((e, i)=>{
        if(i>0 && i % perPage === 0){ doc.addPage(); drawHeading(pair); }
        const j = i % perPage;
        const col = Math.floor(j / rowsPerPage);
        const row = j % rowsPerPage;
        const x = marginX + col*(colWidth+gutterX);
        const y = gridTopY + row*(rowHeight+gutterY);

        doc.setDrawColor(205);
        doc.roundedRect(x, y, colWidth, rowHeight, 4, 4);

        const textMaxWidth = colWidth - 24;
        const padX = x + 12;
        let cy = y + 24;

        doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20);
        doc.text(e.name || '', padX, cy, { maxWidth: textMaxWidth });
        cy += 22;

        if(e.company){
          doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(60);
          doc.text(e.company, padX, cy, { maxWidth: textMaxWidth });
          cy += 16;
        }

        doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(15);
        if(e.address){
          const addrLines = doc.splitTextToSize(e.address, textMaxWidth);
          doc.text(addrLines, padX, cy);
          cy += addrLines.length * 16 + 6;
        }
        if(e.contact1){ doc.text(e.contact1, padX, cy); cy += 17; }
        if(e.contact2){ doc.text(e.contact2, padX, cy); cy += 17; }
        if(e.email){ doc.setFontSize(12); doc.text(`Email: ${e.email}`, padX, cy, { maxWidth: textMaxWidth }); }
      });
    });

    savePdf(doc, filename);
  }

  function exportAddressPdf(list, note, showGroupSub, filename){
    filename = filename || 'digital-address-book.pdf';
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});

    const mm = 2.834645669;
    const labelW = 100 * mm, labelH = 35 * mm;
    const pageWidth = 595.28;
    const columns = 2, rowsPerPage = 8;
    const marginX = (pageWidth - columns*labelW) / 2;
    const marginY = (841.89 - rowsPerPage*labelH) / 2;
    const colWidth = labelW, rowHeight = labelH;
    const perPage = columns * rowsPerPage;

    if(!list.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(20);
      doc.text('No entries selected.', marginX, marginY + 20);
      savePdf(doc, filename);
      return;
    }

    list.forEach((e, i)=>{
      if(i>0 && i % perPage === 0) doc.addPage();
      const j = i % perPage;
      const col = Math.floor(j / rowsPerPage);
      const row = j % rowsPerPage;
      const x = marginX + col*colWidth;
      const y = marginY + row*rowHeight;

      doc.setDrawColor(205);
      doc.rect(x, y, colWidth, rowHeight);

      const padX = x + 8;
      const textMaxWidth = colWidth - 16;
      let cy = y + 13;

      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(20);
      doc.text(e.name || '', padX, cy, { maxWidth: textMaxWidth });
      cy += 11;

      if(e.company){
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(60);
        doc.text(e.company, padX, cy, { maxWidth: textMaxWidth });
        cy += 9;
      }

      if(showGroupSub){
        doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(90);
        doc.text(`${groupName(e.groupId)} / ${subgroupName(e.subgroupId)}`, padX, cy, { maxWidth: textMaxWidth });
        cy += 8;
      }

      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(15);
      if(e.address){
        const addrLines = doc.splitTextToSize(e.address, textMaxWidth);
        doc.text(addrLines, padX, cy);
        cy += addrLines.length * 9 + 2;
      }
      if(e.contact1){ doc.text(e.contact1, padX, cy); cy += 9; }
      if(e.contact2){ doc.text(e.contact2, padX, cy); cy += 9; }
      if(e.email){ doc.text(`Email: ${e.email}`, padX, cy, { maxWidth: textMaxWidth }); }
    });

    savePdf(doc, filename);
  }

  // ---------------- NAV / RENDER ----------------
  const entityLabelsByTab = {
    create: { group:'Group', subgroup:'Subgroup', address:'Address' },
    modify: { group:'Group', subgroup:'Subgroup', address:'Address' },
    view:   { group:'Group', subgroup:'Subgroup', address:'Address', birthdays:'Birthdays', search:'Search' }
  };
  const tabSubtitles = {
    backup: 'Backup, restore and reset',
    create: 'Add a new Group, Subgroup, Address Entry',
    modify: 'Edit or delete an existing Group, Subgroup or Address entry',
    view: 'Browse entries and view or export them as a PDF'
  };

  function renderEntityTabs(){
    if(state.tab==='backup'){ entityTabsEl.innerHTML=''; return; }
    const labels = entityLabelsByTab[state.tab];
    if(!labels[state.entity]) state.entity = 'address';
    entityTabsEl.innerHTML = Object.keys(labels).map(k=>
      `<div class="entity-tab ${state.entity===k?'active':''}" data-entity="${k}">${labels[k]}</div>`
    ).join('');
    entityTabsEl.querySelectorAll('[data-entity]').forEach(el=>{
      el.onclick = ()=>{ state.entity = el.dataset.entity; state.editingId=null; render(); };
    });
  }

  function renderScreen(){
    const fnMap = {
      create: { group: renderCreateGroup, subgroup: renderCreateSubgroup, address: renderCreateAddress },
      modify: { group: renderModifyGroup, subgroup: renderModifySubgroup, address: renderModifyAddress },
      view:   { group: renderViewGroup, subgroup: renderViewSubgroup, address: renderViewAddress, birthdays: renderViewBirthdays, search: renderViewSearch }
    };
    if(state.tab==='backup'){ renderBackup(); return; }
    fnMap[state.tab][state.entity]();
  }

  function render(){
    topSub.textContent = tabSubtitles[state.tab];
    document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.tab===state.tab));
    entityTabsEl.style.display = state.tab==='backup' ? 'none' : '';
    renderEntityTabs();
    renderScreen();
  }

  document.querySelectorAll('.navbtn').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.tab; state.editingId=null; render(); };
  });
  $('#helpBtn').onclick = ()=> showHelp();
  function resetAllData(){ confirmModal(
    'Clear ALL data (every Group, Subgroup and Address entry) and start a new address book? This cannot be undone.',
    ()=>{
      db = { groups: [], subgroups: [], entries: [], lastGroupId: null, lastSubgroupId: null };
      state.editingId = null;
      save();
      showPopup('All data cleared');
      render();
    },
    'Yes, Clear All'
  ); }

  load();
})();
